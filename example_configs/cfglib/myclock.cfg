[MyClock]
type = Clock
label = Time, and, Date
BackgroundColor = midnightblue
CharColor = yellow
CharSize = 65, 38, 38, 30
CmdKeyCol = blue
OutFormat = %-l:%M:%S%P, %A, %b %-d %Y, Day:  %-j, Week: %-U
ExtraSize = 30,
ExtraFields = HASSpga:sensor.mbr_outside_temp_temperature, HASSpga:sensor.mbr_outside_temp_humidity, HASS:sensor.lr_balcony_am2301_temperature, HASS:sensor.br_balcony_am2301_temperature
ExtraFormat = Patio: {d[0]:.1f}° {d[1]:.0f}%,LR Balcony: {d[2]:.1f}°,BR Balcony: {d[3]:.1f}°